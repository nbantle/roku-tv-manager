# Builds the Windows and Mac apps and attaches them to a GitHub release.
#
# Every push to main builds both apps. If package.json has a version that
# hasn't been released yet, a release "vX.Y.Z" is published with both zips.
# So to publish a new version: bump "version" in package.json and push to main.
name: Build and release

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path "dist/Roku TV Manager-win32-x64" -DestinationPath "Roku-TV-Manager-$version-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Roku-TV-Manager-*-Windows-x64.zip

  mac:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:mac
      - name: Sign (ad hoc) and zip
        run: |
          version=$(node -p "require('./package.json').version")
          app="dist/Roku TV Manager-darwin-universal/Roku TV Manager.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "Roku-TV-Manager-$version-Mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Roku-TV-Manager-*-Mac.zip

  release:
    needs: [windows, mac]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this version already released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Roku TV Manager ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            Roku-TV-Manager-*-Windows-x64.zip
            Roku-TV-Manager-*-Mac.zip
          body: |
            **Download the file for your computer**, unzip it, and open Roku TV Manager.
            - Windows 10/11: `Roku-TV-Manager-…-Windows-x64.zip`
            - Mac (Apple Silicon or Intel, macOS 12+): `Roku-TV-Manager-…-Mac.zip`

            First launch: see "Installing" in the README for the one-time Windows SmartScreen / macOS "Open Anyway" step.
